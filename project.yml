# Описание проекта для XcodeGen: по этому файлу на GitHub автоматически
# создаётся проект Xcode. Вручную в Xcode ничего настраивать не нужно.
name: SchoolHelper

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  SchoolHelper:
    type: application
    platform: iOS
    sources:
      - SchoolHelper
    settings:
      base:
        PRODUCT_NAME: SchoolHelper
        PRODUCT_BUNDLE_IDENTIFIER: ru.school.helper.k7q4m2
        INFOPLIST_FILE: Support/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Подписывает Sideloadly при установке, поэтому здесь подпись не нужна
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  SchoolHelper:
    build:
      targets:
        SchoolHelper: all
